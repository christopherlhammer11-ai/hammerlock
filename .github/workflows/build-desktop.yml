name: Build Desktop Apps

permissions:
  contents: write

on:
  workflow_dispatch: # Manual trigger from GitHub Actions tab
  push:
    tags:
      - 'v*' # Auto-build on version tags like v0.2.0

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Build Windows Installer
        run: npx electron-builder --win --publish never
      - name: Generate Windows checksums
        shell: pwsh
        run: |
          Get-ChildItem dist-electron -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content dist-electron/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist-electron/*.exe
            dist-electron/SHA256SUMS-windows.txt
      - name: Publish Windows installer on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/*.exe
            dist-electron/SHA256SUMS-windows.txt

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Build Linux packages
        run: npx electron-builder --linux --publish never
      - name: Generate Linux checksums
        run: sha256sum dist-electron/*.AppImage dist-electron/*.deb > dist-electron/SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/SHA256SUMS-linux.txt
      - name: Publish Linux packages on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/SHA256SUMS-linux.txt
